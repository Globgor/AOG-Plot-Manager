name: Maintenance task
description: Configuration, documentation, tests, or maintenance of existing behavior.
labels: [task]
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not attach credentials, personal data, client databases, private source material, or copyrighted scans."
  - type: textarea
    id: scope
    attributes:
      label: Scope and reason
      description: Identify the affected files, components, or configuration.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Completion evidence
      description: State what should change and which checks will demonstrate completion.
    validations:
      required: true
