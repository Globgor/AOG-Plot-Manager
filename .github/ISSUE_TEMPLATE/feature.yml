name: Feature request
description: Propose a new supported operation or an extension of behavior.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not attach credentials, personal data, client databases, private source material, or copyrighted scans."
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected operation
      description: Explain who needs the operation and why existing features are insufficient.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Requested outcome
      description: Describe the expected behavior using a synthetic example.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Give observable results, roles, units, and relevant edge cases.
    validations:
      required: true
